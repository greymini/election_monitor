# Giridih AC-32 Election Monitor - single-VPS deployment (LLD 1)
# 4 vCPU / 8 GB RAM / 80 GB SSD is the reference target.
name: giridih-monitor

services:
  db:
    # A1. This was `image: pgvector/pgvector:pg16`, which ships pgvector and no
    # PostGIS, so 0001_extensions.sql failed on its first line and a clean
    # checkout could not start at all. Built locally from the PostGIS image
    # with pgvector added; docker/Dockerfile.db explains why that direction and
    # verifies all four extensions at build time.
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    image: giridih-db:pg16-postgis34-pgvector
    container_name: giridih-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    ports:
      - "127.0.0.1:5432:5432"   # localhost only - never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=60

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: giridih-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api:ro
      - ./chatbot:/app/chatbot:ro
      - ./common:/app/common:ro
      - ./analytics:/app/analytics:ro
      - models:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: giridih-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - raw:/data/raw
      - ocr:/data/ocr
      - backups:/data/backups
      - models:/models
      - ./ingest:/app/ingest:ro
      - ./news:/app/news:ro
      - ./analytics:/app/analytics:ro
      - ./common:/app/common:ro
      - ./worker:/app/worker:ro
      - ./db:/app/db:ro
    deploy:
      resources:
        limits:
          memory: 2560m
    command: python -m worker.scheduler

  web:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.web
    container_name: giridih-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  raw:
  ocr:
  backups:
  models:
  certs:
