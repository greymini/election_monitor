[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Project Pulse: field modules (expense ledger, ground reports) for the Jharkhand Election Monitor"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
